spring:
  datasource:
    url: jdbc:sqlserver://localhost;databaseName=VirtualHumanVision;encrypt=false
    username: development
    password: myjava123
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    show-sql: true
    properties:
      hibernate:
        show_sql: true
        dialect: org.hibernate.dialect.SQLServerDialect
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    hibernate:
      ddl-auto: none
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: method
media:
  url: http://localhost/media/
  upload-base-dir: D:\final_project_dba\server\res\